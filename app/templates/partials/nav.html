<nav class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
        <a href="{{ url_for('main.home_page') }}" class="text-lg font-semibold text-gray-900">
            <img src="{{ url_for('static', filename='images/CA-Short-Logo-Red.svg') }}" class="w-12 sm:w-8 md:w-10 lg:w-12 h-auto" alt="Logo">
        </a>
        <div class="flex gap-6 text-sm font-medium text-gray-600">
            <a href="{{ url_for('main.home_page') }}" class="hover:text-gray-900">Home</a>
            <a href="{{ url_for('main.about') }}" class="hover:text-gray-900">About</a>
            {% if current_user.is_authenticated %}
                <span class="text-gray-500">{{ current_user.name or current_user.email }}</span>
                <form method="post" action="{{ url_for('auth.logout') }}">
                    {{ logout_form.csrf_token }}
                    <button type="submit" class="hover:text-gray-900">Sign out</button>
                </form>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="hover:text-gray-900">Sign in</a>
            {% endif %}
        </div>
    </div>
</nav>
